name: Full-Scope Security & LLM Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. LLM Data-Flow Scanning (.py, .ts, .tsx, .js)
  promptfoo-code-scan:
    name: Promptfoo LLM Code Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Promptfoo Static Code Scan
        run: |
          npx promptfoo@latest code-scans run strix/ \
            --output promptfoo-codescan.sarif \
            --format sarif || true

      - name: Upload Promptfoo Code Scan SARIF
        if: always() && hashFiles('promptfoo-codescan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: promptfoo-codescan.sarif
          category: promptfoo-code-scan

  # 2. Dynamic Agent Prompt & Skill Red Teaming (.jinja, .md)
  promptfoo-redteam:
    name: Promptfoo Dynamic Prompt Red Team
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROMPTFOO_PASS_RATE_THRESHOLD: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python & PyYAML
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Dynamic promptfooconfig.yaml
        run: |
          pip install pyyaml
          python scripts/generate_promptfoo_config.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Promptfoo Red Team
        run: |
          npx promptfoo@latest redteam run \
            --config promptfooconfig.yaml \
            --output redteam-results.json \
            --injectVar untrusted_tool_output \
            --max-concurrency 3 \
            --tag git.sha="${{ github.sha }}"

      - name: Upload Red Team Report Artifact
        if: always() && hashFiles('redteam-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-redteam-report
          path: redteam-results.json

  # 3. Multi-Language SAST (.go, .sh, .py, .ts)
  sast-all-languages:
    name: SAST (Go, Bash, Python, TS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Semgrep (All Languages)
        run: |
          pip install semgrep
          semgrep scan --config auto --sarif --output semgrep.sarif || true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Run ShellCheck on Container & Build Scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -type f -name "*.sh" -exec shellcheck --severity=error {} +

      - name: Run Gosec on Go TUI
        uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Upload Gosec SARIF
        if: always() && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

  # 4. Containers, Secrets & Lockfiles
  supply-chain-and-containers:
    name: Trivy Container & Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy Scan (Reports All CRITICAL/HIGH Findings)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
